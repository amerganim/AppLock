name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Skip the action's default install: it asks for the long-obsolete "tools"
          # package, which Google has removed from the SDK repository, and sdkmanager
          # exits non-zero. The packages this build actually needs are installed below.
          packages: ''

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug + lint
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lockapp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          # Keep storage inside the free Actions quota.
          retention-days: 7
